<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discover Servers — 360</title>
  <link rel="icon" type="image/png" href="favicon-32x32.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="/assets/css/main.css" />
  <link rel="stylesheet" href="/assets/css/wide.css" />
  <link rel="stylesheet" href="/assets/css/gallium.css" />
  <link rel="stylesheet" href="/assets/css/cursor.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { min-height: 100vh; }

    .disc-shell {
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 20px 60px;
    }

    .disc-header {
      margin-bottom: 28px;
    }

    .disc-header h1 {
      font-size: clamp(22px, 4vw, 32px);
      font-weight: 800;
      margin: 0 0 6px;
      color: var(--txt);
    }

    body.dark .disc-header h1 { color: var(--txtd); }

    .disc-header p {
      font-size: 14px;
      color: var(--mut);
      margin: 0;
    }

    body.dark .disc-header p { color: var(--mutd); }

    .disc-controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .disc-search {
      flex: 1;
      min-width: 200px;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid var(--br);
      background: rgba(255,255,255,0.08);
      color: var(--txt);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color .2s;
    }

    .disc-search:focus { border-color: var(--a); }
    body.dark .disc-search { background: rgba(255,255,255,0.06); color: var(--txtd); }

    .disc-category {
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid var(--br);
      background: rgba(255,255,255,0.08);
      color: var(--txt);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      outline: none;
    }

    body.dark .disc-category { background: rgba(255,255,255,0.06); color: var(--txtd); }

    .disc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .disc-card {
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--br);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color .2s, transform .15s;
      cursor: default;
    }

    body.dark .disc-card { background: rgba(255,255,255,0.04); }
    .disc-card:hover { border-color: var(--a); transform: translateY(-2px); }

    .disc-card-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .disc-avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--a), var(--a2, #8b5cf6));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
      overflow: hidden;
    }

    .disc-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .disc-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--txt);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    body.dark .disc-name { color: var(--txtd); }

    .disc-category-tag {
      font-size: 11px;
      color: var(--mut);
    }

    body.dark .disc-category-tag { color: var(--mutd); }

    .disc-desc {
      font-size: 13px;
      color: var(--mut);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    body.dark .disc-desc { color: var(--mutd); }

    .disc-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
    }

    .disc-members {
      font-size: 12px;
      color: var(--mut);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    body.dark .disc-members { color: var(--mutd); }

    .disc-join-btn {
      padding: 7px 18px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(120deg, var(--a), var(--a2, #8b5cf6));
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: opacity .2s;
    }

    .disc-join-btn:hover { opacity: .85; }
    .disc-join-btn:disabled { opacity: .5; cursor: default; }

    .disc-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--mut);
    }

    body.dark .disc-empty { color: var(--mutd); }

    .disc-empty svg { opacity: .3; margin-bottom: 12px; }

    .disc-skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,.06) 25%, rgba(255,255,255,.12) 50%, rgba(255,255,255,.06) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 8px;
      height: 14px;
    }

    @keyframes shimmer { to { background-position: -200% 0; } }
  </style>
</head>
<body>

  <div class="auth-top-right">
    <button id="signInBtn" class="auth-btn">Sign In</button>
    <button id="signUpBtn" class="auth-btn">Sign Up</button>
    <button id="signOutBtn" class="auth-btn" style="display:none;">Sign Out</button>
  </div>

  <button class="sidebar-toggle" id="sidebarToggle">☰ Menu</button>
  <aside class="sidebar" id="sidebar"><span id="sidebar-slot"></span></aside>
  <div class="overlay" id="overlay"></div>

  <div class="disc-shell">
    <div class="disc-header">
      <h1>Discover Servers</h1>
      <p>Find communities to join — no invite link needed.</p>
    </div>

    <div class="disc-controls">
      <input class="disc-search" id="discSearch" type="text" placeholder="Search servers…" autocomplete="off" />
      <select class="disc-category" id="discCategory">
        <option value="">All categories</option>
        <option value="Gaming">Gaming</option>
        <option value="Tech">Tech</option>
        <option value="Art">Art</option>
        <option value="Music">Music</option>
        <option value="Science">Science</option>
        <option value="Education">Education</option>
        <option value="Social">Social</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="disc-grid" id="discGrid">
      <div class="disc-card" style="pointer-events:none;">
        <div class="disc-card-top"><div class="disc-avatar"></div><div style="flex:1;"><div class="disc-skeleton" style="width:60%;margin-bottom:6px;"></div><div class="disc-skeleton" style="width:35%;height:10px;"></div></div></div>
        <div class="disc-skeleton"></div><div class="disc-skeleton" style="width:75%;"></div>
      </div>
      <div class="disc-card" style="pointer-events:none;">
        <div class="disc-card-top"><div class="disc-avatar"></div><div style="flex:1;"><div class="disc-skeleton" style="width:60%;margin-bottom:6px;"></div><div class="disc-skeleton" style="width:35%;height:10px;"></div></div></div>
        <div class="disc-skeleton"></div><div class="disc-skeleton" style="width:75%;"></div>
      </div>
      <div class="disc-card" style="pointer-events:none;">
        <div class="disc-card-top"><div class="disc-avatar"></div><div style="flex:1;"><div class="disc-skeleton" style="width:60%;margin-bottom:6px;"></div><div class="disc-skeleton" style="width:35%;height:10px;"></div></div></div>
        <div class="disc-skeleton"></div><div class="disc-skeleton" style="width:75%;"></div>
      </div>
    </div>
  </div>

  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/auth-fix.js"></script>
  <script src="/assets/js/wide.js"></script>
  <script src="/assets/js/gallium.js"></script>
  <script src="/assets/js/cursor.js"></script>

  <script>
  (async function initDiscover() {
    const sb = supabase.createClient(
      'https://wiswfpfsjiowtrdyqpxy.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indpc3dmcGZzamlvd3RyZHlxcHh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgzMzg4OTcsImV4cCI6MjA4MzkxNDg5N30.z_4FtM2c8UwgrRlafPYjolQuod4IoHQats95XHio1zM'
    );

    const grid     = document.getElementById('discGrid');
    const search   = document.getElementById('discSearch');
    const catSel   = document.getElementById('discCategory');

    let allServers = [];
    let currentUser = null;
    let joinedIds   = new Set();

    const { data: { user } } = await sb.auth.getUser();
    currentUser = user;

    if (currentUser) {
      const { data: memberships } = await sb.from('server_members').select('server_id').eq('user_id', currentUser.id);
      joinedIds = new Set((memberships || []).map(m => m.server_id));
    }

    const { data: servers } = await sb
      .from('servers')
      .select('id, name, description, icon_url, category, owner_id, created_at')
      .eq('is_public', true)
      .order('created_at', { ascending: false })
      .limit(100);

    if (servers?.length) {
      const ids = servers.map(s => s.id);
      const { data: counts } = await sb
        .from('server_members')
        .select('server_id')
        .in('server_id', ids);

      const memberCount = {};
      (counts || []).forEach(r => { memberCount[r.server_id] = (memberCount[r.server_id] || 0) + 1; });
      allServers = servers.map(s => ({ ...s, memberCount: memberCount[s.id] || 0 }));
    } else {
      allServers = [];
    }

    render();

    search.addEventListener('input', render);
    catSel.addEventListener('change', render);

    function render() {
      const q   = search.value.trim().toLowerCase();
      const cat = catSel.value;
      const filtered = allServers.filter(s =>
        (!q || s.name.toLowerCase().includes(q) || (s.description||'').toLowerCase().includes(q)) &&
        (!cat || s.category === cat)
      );

      if (!filtered.length) {
        grid.innerHTML = `<div class="disc-empty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <p>No public servers found${q ? ` for "${q}"` : ''}.</p>
          <p style="font-size:13px;">Server owners can make their server public in server settings.</p>
        </div>`;
        return;
      }

      grid.innerHTML = filtered.map(s => {
        const initial = (s.name || '?')[0].toUpperCase();
        const joined  = joinedIds.has(s.id);
        const avatar  = s.icon_url
          ? `<img src="${s.icon_url}" alt="" loading="lazy" />`
          : initial;
        return `<div class="disc-card">
          <div class="disc-card-top">
            <div class="disc-avatar">${avatar}</div>
            <div style="min-width:0;">
              <div class="disc-name">${escHtml(s.name)}</div>
              <div class="disc-category-tag">${escHtml(s.category || 'General')}</div>
            </div>
          </div>
          <div class="disc-desc">${escHtml(s.description || 'No description.')}</div>
          <div class="disc-card-footer">
            <div class="disc-members">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              ${s.memberCount.toLocaleString()} member${s.memberCount !== 1 ? 's' : ''}
            </div>
            <button class="disc-join-btn" data-id="${s.id}" ${joined ? 'disabled' : ''}>
              ${joined ? 'Joined' : 'Join'}
            </button>
          </div>
        </div>`;
      }).join('');

      grid.querySelectorAll('.disc-join-btn:not([disabled])').forEach(btn => {
        btn.addEventListener('click', () => joinServer(btn.dataset.id, btn));
      });
    }

    async function joinServer(serverId, btn) {
      if (!currentUser) {
        document.getElementById('signInBtn')?.click();
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Joining…';
      const { error } = await sb.from('server_members').insert({ server_id: serverId, user_id: currentUser.id, role: 'member' });
      if (error) {
        btn.disabled = false;
        btn.textContent = 'Join';
        return;
      }
      joinedIds.add(serverId);
      const s = allServers.find(s => s.id === serverId);
      if (s) s.memberCount++;
      btn.textContent = 'Joined';
      setTimeout(() => { window.location.href = '/chat?server=' + serverId; }, 600);
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  })();
  </script>
</body>
</html>
