<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>360 — Password Reset</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#3b82f6" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="favicon-32x32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="/assets/css/main.css" />
  <link rel="stylesheet" href="/assets/css/wide.css" />
  <link rel="stylesheet" href="/assets/css/gallium.css" />
  <link rel="stylesheet" href="/assets/css/cursor.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .ac-wrap { margin: 80px 20px; width: 420px; max-width: calc(100vw - 40px); position: relative; z-index: 1; }
    .ac-card {
      background: rgba(255,255,255,.97); backdrop-filter: blur(22px);
      border: 1px solid var(--br); border-radius: 20px; padding: 40px 38px 34px;
      box-shadow: 0 20px 60px rgba(0,0,0,.10), 0 4px 16px rgba(0,0,0,.05);
      display: flex; flex-direction: column;
    }
    body.dark .ac-card { background: rgba(9,9,20,.97); border-color: rgba(255,255,255,.1); box-shadow: 0 20px 60px rgba(0,0,0,.45); }
    .ac-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .ac-logo-mark { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--a), var(--a2)); flex-shrink: 0; }
    .ac-logo-text { font-size: 21px; font-weight: 900; letter-spacing: -.02em; color: var(--txt); }
    body.dark .ac-logo-text { color: var(--txtd); }
    .ac-title { font-size: 17px; font-weight: 800; margin-bottom: 18px; color: var(--txt); }
    body.dark .ac-title { color: var(--txtd); }
    .ac-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
    .ac-field label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--mut); }
    body.dark .ac-field label { color: var(--mutd); }
    .ac-field input {
      width: 100%; padding: 11px 13px; border-radius: 9px; border: 1.5px solid var(--br);
      background: rgba(255,255,255,.75); color: var(--txt); font-size: 14px; outline: none;
      transition: border-color .18s, box-shadow .18s;
    }
    body.dark .ac-field input { background: rgba(255,255,255,.06); color: var(--txtd); border-color: rgba(255,255,255,.12); }
    .ac-field input:focus { border-color: var(--a); box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
    .ac-btn {
      width: 100%; padding: 12px; border-radius: 10px; border: none;
      background: linear-gradient(110deg, var(--a), var(--a2)); color: #050816; font-weight: 700; font-size: 15px;
      cursor: pointer; transition: opacity .18s, transform .15s; margin-top: 6px;
    }
    .ac-btn:hover:not(:disabled) { opacity: .87; transform: translateY(-1px); }
    .ac-btn:disabled { opacity: .45; cursor: not-allowed; }
    .ac-msg { font-size: 13px; text-align: center; min-height: 18px; margin-top: 10px; }
    .ac-msg.err { color: #ef4444; }
    .ac-msg.ok  { color: #10b981; }
    .ac-switch { font-size: 13px; text-align: center; margin-top: 14px; color: var(--mut); }
    body.dark .ac-switch { color: var(--mutd); }
    .ac-switch a { color: var(--a); font-weight: 600; text-decoration: none; }
    .ac-switch a:hover { text-decoration: underline; }
    .pw-hint { font-size: 12px; color: var(--mut); margin-bottom: 10px; }
    body.dark .pw-hint { color: var(--mutd); }
  </style>
</head>
<body>

  <div class="ac-wrap">
    <div class="ac-card">
      <div class="ac-logo">
        <div class="ac-logo-mark"></div>
        <span class="ac-logo-text">360</span>
      </div>
      <div class="ac-title" id="rpTitle">Set a new password</div>
      <div id="rpContent">
        <p class="pw-hint">Verifying your reset link…</p>
      </div>
    </div>
  </div>

  <script>
    const sb = supabase.createClient(
      "https://wiswfpfsjiowtrdyqpxy.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indpc3dmcGZzamlvd3RyZHlxcHh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgzMzg4OTcsImV4cCI6MjA4MzkxNDg5N30.z_4FtM2c8UwgrRlafPYjolQuod4IoHQats95XHio1zM"
    );

    const rpContent = document.getElementById('rpContent');

    function setMsg(el, text, type) {
      if (!el) return;
      el.textContent = text;
      el.className = "ac-msg" + (type ? " " + type : "");
    }

    function renderForm() {
      rpContent.innerHTML = `
        <div class="ac-field">
          <label>New Password</label>
          <input id="rpPass" type="password" placeholder="Min. 6 characters" autocomplete="new-password" />
        </div>
        <div class="ac-field">
          <label>Confirm Password</label>
          <input id="rpPass2" type="password" placeholder="Repeat password" autocomplete="new-password" />
        </div>
        <p class="ac-msg" id="rpMsg"></p>
        <button class="ac-btn" id="rpBtn">Update Password</button>
      `;
      const pass = document.getElementById('rpPass');
      const pass2 = document.getElementById('rpPass2');
      const msg = document.getElementById('rpMsg');
      const btn = document.getElementById('rpBtn');
      pass2.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });

      btn.onclick = async () => {
        const p1 = pass.value, p2 = pass2.value;
        if (!p1 || p1.length < 6) { setMsg(msg, 'Password must be at least 6 characters.', 'err'); return; }
        if (p1 !== p2) { setMsg(msg, 'Passwords do not match.', 'err'); return; }
        btn.disabled = true; btn.textContent = 'Updating…'; setMsg(msg, '', '');
        const { error } = await sb.auth.updateUser({ password: p1 });
        if (error) {
          setMsg(msg, error.message, 'err');
          btn.disabled = false; btn.textContent = 'Update Password';
          return;
        }
        setMsg(msg, 'Password updated! Redirecting to sign in…', 'ok');
        await sb.auth.signOut();
        setTimeout(() => window.location.replace('/signin'), 1200);
      };
    }

    function renderInvalid() {
      document.getElementById('rpTitle').textContent = 'Link expired or invalid';
      rpContent.innerHTML = `
        <p class="pw-hint">This password reset link is invalid or has expired. Request a new one from the sign-in page.</p>
        <p class="ac-switch"><a href="/account?forgot">Request a new reset link</a></p>
      `;
    }

    (async () => {
      // Supabase's client picks up the recovery token from the URL (hash or
      // PKCE "code" param) automatically and, once processed, fires this
      // event with a valid session — that's our signal the link was good.
      let handled = false;
      sb.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY' && session) {
          handled = true;
          renderForm();
        }
      });

      // Fallback: some flows already have the session by the time we check.
      setTimeout(async () => {
        if (handled) return;
        const { data: { session } } = await sb.auth.getSession();
        if (session) { handled = true; renderForm(); }
        else renderInvalid();
      }, 1200);
    })();
  </script>
</body>
</html>
