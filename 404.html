<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>404 — Page Not Found</title>
<link href="/favicon-32x32.png" rel="icon" type="image/png"/>
<link href="/assets/css/main.css" rel="stylesheet"/>
<link href="/assets/css/wide.css" rel="stylesheet"/>
<link href="/assets/css/gallium.css" rel="stylesheet"/>
<link href="/assets/css/cursor.css" rel="stylesheet"/>
<style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .wrap {
      max-width: 480px;
      padding: 40px 24px;
      animation: fadeUp .5s cubic-bezier(.22,.68,0,1.1);
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(30px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .code {
      font-size: 96px;
      font-weight: 900;
      letter-spacing: -.04em;
      background: linear-gradient(120deg, var(--a), var(--a2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 12px;
    }
    .msg {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--txt);
    }
    body.dark .msg { color: var(--txtd); }
    .sub {
      font-size: 14px;
      color: var(--mut);
      margin-bottom: 32px;
      line-height: 1.6;
    }
    body.dark .sub { color: var(--mutd); }
    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      border-radius: 999px;
      background: linear-gradient(120deg, var(--a), var(--a2));
      color: #050816;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      transition: opacity .2s, transform .2s;
    }
    .home-btn:hover { opacity: .87; transform: translateY(-2px); }

    .nav-suggest {
      margin-bottom: 20px;
      min-height: 0;
    }
    .nav-suggest-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 26px;
      border-radius: 999px;
      border: 1.5px solid var(--a);
      background: transparent;
      color: var(--a);
      font-weight: 700;
      font-size: 14.5px;
      cursor: pointer;
      transition: background .2s, transform .2s, color .2s;
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp .45s cubic-bezier(.22,.68,0,1.1) forwards;
    }
    .nav-suggest-btn:hover {
      background: var(--a);
      color: #050816;
      transform: translateY(-2px);
    }
    .nav-suggest-btn svg { flex-shrink: 0; }
  </style>
<meta content="404  Page Not Found — part of the 360 web platform." name="description"/><meta content="noindex, nofollow" name="robots"/><meta content="website" property="og:type"/><meta content="404 — Page Not Found" property="og:title"/><meta content="404  Page Not Found — part of the 360 web platform." property="og:description"/><meta content="https://360-search.com/404.html" property="og:url"/><meta content="360" property="og:site_name"/><meta content="summary" name="twitter:card"/><meta content="404 — Page Not Found" name="twitter:title"/><meta content="404  Page Not Found — part of the 360 web platform." name="twitter:description"/><link href="https://360-search.com/404.html" rel="canonical"/></head>
<body>
<div class="cursor-dot"></div>
<div class="cursor-trail"></div>
<div class="auth-top-right">
<button class="auth-btn" id="signInBtn">Sign In</button>
<button class="auth-btn" id="signUpBtn">Sign Up</button>
<button class="auth-btn" id="signOutBtn" style="display:none;">Sign Out</button>
</div>
<div class="wrap">
<div class="code">404</div>
<div class="msg">Page not found</div>
<p class="sub">Looks like this page doesn't exist — or maybe it moved.<br/>Head back to 360 and keep searching.</p>
<div class="nav-suggest" id="nav-suggest"></div>
<a class="home-btn" href="/">← Back to 360</a>
</div>
<script src="/assets/js/main.js"></script>
<script src="/assets/js/auth-fix.js"></script>
<script src="/assets/js/wide.js"></script>
<script src="/assets/js/gallium.js"></script>
<script src="/assets/js/cursor.js"></script>
<script>
    (() => {
      // Ask the AI-backed navigate-suggest edge function whether the
      // broken path the user landed on looks like a typo/shorthand for
      // a real 360 destination (menu item, app, or game). If so, show
      // a one-click button to jump straight there.
      const NAV_SUGGEST_URL = "https://wiswfpfsjiowtrdyqpxy.supabase.co/functions/v1/navigate-suggest-groq";
      const container = document.getElementById("nav-suggest");
      if (!container) return;

      const attemptedPath = location.pathname || "/";
      // Nothing useful to suggest for the root itself.
      if (attemptedPath === "/" || attemptedPath === "") return;

      fetch(NAV_SUGGEST_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: attemptedPath }),
      })
        .then(res => res.json())
        .then(data => {
          if (!data || !data.match) return;

          const btn = document.createElement("button");
          btn.className = "nav-suggest-btn";
          btn.type = "button";
          btn.innerHTML = `
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
            <span>Do you mean ${data.label ? escapeNavHtml(data.label) : data.match}? Navigate to it now!</span>
          `;
          btn.addEventListener("click", () => {
            window.location.href = data.match;
          });

          container.innerHTML = "";
          container.appendChild(btn);
        })
        .catch(() => {
          // Silent fail — the default "Back to 360" button is still there.
        });

      function escapeNavHtml(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
    })();
  </script>
</body>
</html>
