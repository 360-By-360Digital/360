<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>360VPN — 360-search.com</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    :root {
      --bg:#0a0a0a; --bg2:#111; --border:#2a2a2a;
      --green:#00ff88; --green-dim:#00cc66;
      --red:#ff4444; --text:#ccc; --text-dim:#666;
      --font:'Share Tech Mono', monospace;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px}

    .topbar{
      display:flex;justify-content:space-between;
      padding:10px 20px;background:var(--bg2);
      border-bottom:1px solid var(--border)
    }

    .status{color:var(--text-dim)}
    .status.on{color:var(--green)}

    .wrap{max-width:900px;margin:auto;padding:30px}

    .panel{
      border:1px solid var(--border);
      background:var(--bg2);
      margin-top:15px;
      padding:15px;
    }

    button{
      background:transparent;
      border:1px solid var(--green-dim);
      color:var(--green);
      padding:8px 14px;
      cursor:pointer;
    }

    button:hover{background:var(--green);color:#000}

    .log{margin-top:10px;font-size:11px;color:var(--text-dim)}
  </style>
</head>

<body>

<div class="topbar">
  <div>360VPN</div>
  <div id="status" class="status">DISCONNECTED</div>
</div>

<div class="wrap">

  <div class="panel">
    <h3>Proxy Test</h3>
    <button onclick="checkProxy()">Check Proxy</button>
    <div class="log" id="log"></div>
  </div>

  <div class="panel">
    <h3>Live Test</h3>
    <button onclick="testProxy()">Fetch IP</button>
    <pre id="out"></pre>
  </div>

</div>

<script>
const PROXY_URL = "/vpn/proxy";
const TEST_URL = "https://api.ipify.org?format=json";

function log(msg){
  document.getElementById("log").innerText += msg + "\n";
}

async function fetchViaProxy(url){
  return fetch(PROXY_URL + "?url=" + encodeURIComponent(url));
}

async function checkProxy(){
  try{
    const r = await fetchViaProxy(TEST_URL);
    const text = await r.text();

    const header = r.headers.get("X-360VPN-Proxied");

    if(header === "true"){
      document.getElementById("status").innerText = "CONNECTED";
      document.getElementById("status").classList.add("on");
      log("Proxy OK");
    } else {
      log("Proxy header missing (Worker issue)");
    }

  } catch(e){
    log("ERROR: " + e.message);
  }
}

async function testProxy(){
  const out = document.getElementById("out");
  out.textContent = "Loading...";

  try{
    const r = await fetchViaProxy(TEST_URL);
    const t = await r.text();
    out.textContent = t;
  } catch(e){
    out.textContent = e.message;
  }
}
</script>

</body>
</html>
